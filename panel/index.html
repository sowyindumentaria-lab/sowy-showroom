@font-face{font-family:"Bebas Neue";src:url(../fuentes/BebasNeue.woff) format("woff");font-weight:400 700;font-style:normal;font-display:swap}
:root{
  color-scheme:light dark;
  --bg:#FFFFFF;--bg2:#F5F5F7;--surface:#F5F5F7;--surface2:#EBEBEF;--sheet:#FFFFFF;--line:rgba(0,0,0,.1);
  --text:#0B0B0C;--text2:#55555D;--text3:#85858E;--pink:#E6007E;--pink2:#FF4DA6;--pink-text:#C2006B;
  --ink:#0B0B0C;--on-ink:#FFFFFF;--green:#008932;--green-bg:rgba(52,199,89,.16);--red:#D70015;--red-bg:rgba(255,56,60,.12);--warn:#8A5A00;--warn-bg:rgba(255,204,0,.2);
  --bar:rgba(255,255,255,.88);--scrim:rgba(0,0,0,.45);--toast:#0B0B0C;--toast-text:#fff;--art-bg:#E4E4E8;--art-hi:#F7F7F9;--sw-off:#C9C9D0;
  --ease:cubic-bezier(.32,.72,0,1);--snap:cubic-bezier(.36,.66,.04,1);--pink-fill:#E6007E;
  --display:"Bebas Neue","DIN Condensed","Avenir Next Condensed","Oswald","Arial Narrow","sans-serif-condensed",Impact,sans-serif
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0A0A0B;--bg2:#111113;--surface:#1A1A1D;--surface2:#232327;--sheet:#161618;--line:rgba(255,255,255,.1);
  --text:#F5F5F7;--text2:#B0B0BA;--text3:#7C7C86;--pink:#FF2E9A;--pink2:#FF6DB7;--pink-text:#FF5CAF;
  --ink:#F5F5F7;--on-ink:#0B0B0C;--green:#4ADE80;--green-bg:rgba(74,222,128,.15);--red:#FF5A5F;--red-bg:rgba(255,90,95,.15);--warn:#FFC24D;--warn-bg:rgba(255,194,77,.16);
  --bar:rgba(17,17,19,.9);--scrim:rgba(0,0,0,.62);--toast:#2b2b30;--toast-text:#fff;--art-bg:#2A2A30;--art-hi:#3A3A42;--sw-off:#46464e
}}
:root[data-theme="light"]{color-scheme:light}
:root[data-theme="dark"]{
color-scheme:dark;
  --bg:#0A0A0B;--bg2:#111113;--surface:#1A1A1D;--surface2:#232327;--sheet:#161618;--line:rgba(255,255,255,.1);
  --text:#F5F5F7;--text2:#B0B0BA;--text3:#7C7C86;--pink:#FF2E9A;--pink2:#FF6DB7;--pink-text:#FF5CAF;
  --ink:#F5F5F7;--on-ink:#0B0B0C;--green:#4ADE80;--green-bg:rgba(74,222,128,.15);--red:#FF5A5F;--red-bg:rgba(255,90,95,.15);--warn:#FFC24D;--warn-bg:rgba(255,194,77,.16);
  --bar:rgba(17,17,19,.9);--scrim:rgba(0,0,0,.62);--toast:#2b2b30;--toast-text:#fff;--art-bg:#2A2A30;--art-hi:#3A3A42;--sw-off:#46464e
}
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--text);font:400 16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{padding:0 0 calc(86px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
a,button,.prod{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
a{color:var(--pink-text)}
:focus-visible{outline:2px solid var(--pink);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}
header.top{position:sticky;top:0;z-index:20;background:var(--bar);-webkit-backdrop-filter:blur(16px) saturate(180%);backdrop-filter:blur(16px) saturate(180%);border-bottom:.5px solid var(--line);padding:calc(10px + env(safe-area-inset-top)) 0 10px}
header.top .wrap{display:flex;align-items:center;gap:10px}
.logo{display:flex;align-items:center;gap:12px}
.logo i{display:block;height:28px;aspect-ratio:1652/1008;background:var(--text);-webkit-mask:var(--m) center/contain no-repeat;mask:var(--m) center/contain no-repeat;--m:url(../marca/sowy.png);flex:none}
.logo small{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);line-height:1.2;max-width:70px}
.display,h2{font-family:var(--display);font-weight:700;text-transform:uppercase;letter-spacing:.01em}
.sp{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 20px;border-radius:999px;font-weight:600;font-size:15px;background:var(--surface2);text-decoration:none;color:var(--text);transition:transform .15s var(--snap),filter .2s}
.btn:active{transform:scale(.96)}
.btn.primary{background:var(--pink-fill);color:#fff}
.btn.danger{background:var(--red-bg);color:var(--red)}
.btn.sm{height:36px;padding:0 14px;font-size:14px}
.btn.icon{width:36px;padding:0}
.btn.icon svg{width:18px;height:18px;grid-area:1/1;transition:transform .5s var(--ease),opacity .25s}
.btn.icon{display:inline-grid;place-items:center}
:root[data-theme="dark"] .btn.icon .i-moon,:root:not([data-theme="dark"]) .btn.icon .i-sun{opacity:0;transform:rotate(-70deg) scale(.5)}
.btn[disabled]{opacity:.45;pointer-events:none}
main{padding-top:16px}
h2{font-size:36px;line-height:1;margin-bottom:4px}
.hint{color:var(--text3);font-size:13.5px}
.card{background:var(--surface);border-radius:16px;padding:16px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;align-items:center}
.wrapx{flex-wrap:wrap}
input[type=text],input[type=number],input[type=tel],input[type=email],input[type=search],select,textarea{width:100%;background:var(--bg);border:0;border-radius:12px;padding:12px 13px;box-shadow:inset 0 0 0 .5px var(--line);outline:none}
input:focus,select:focus,textarea:focus{box-shadow:inset 0 0 0 1.5px var(--pink)}
textarea{min-height:110px;resize:vertical;line-height:1.4}
label.l{display:block;font-size:12.5px;font-weight:600;color:var(--text2);margin:0 0 5px;letter-spacing:.02em}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:34px;padding:0 13px;border-radius:999px;font-size:14px;font-weight:500;color:var(--text2);background:var(--surface);box-shadow:inset 0 0 0 .5px var(--line)}
.chip[aria-pressed=true]{background:var(--ink);color:var(--on-ink)}
.list{display:flex;flex-direction:column;gap:10px}
.prod{display:flex;gap:12px;align-items:center;padding:12px;border-radius:16px;background:var(--surface);cursor:pointer;transition:background .2s}
.prod:hover{background:var(--surface2)}
.prod.off{opacity:.55}
.th{flex:none;width:56px;height:70px;border-radius:12px;background:var(--art-bg);overflow:hidden;position:relative}
.th img,.th svg{width:100%;height:100%;object-fit:cover;display:block}
.info{flex:1;min-width:0}
.info b{display:-webkit-box;font-size:16px;line-height:1.2;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.info small{display:block;color:var(--text3);font-size:12.5px;margin-top:1px}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px}
.tag{font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--surface2);color:var(--text2)}
.tag.of{background:rgba(230,0,126,.14);color:var(--pink-text)}
.tag.ok{background:var(--green-bg);color:var(--green)}
.tag.warn{background:var(--warn-bg);color:var(--warn)}
.tag.bad{background:var(--red-bg);color:var(--red)}
.price{font-weight:700;text-align:right;font-size:15px}
.price s{display:block;color:var(--text3);font-weight:400;font-size:12.5px}
.sw{position:relative;flex:none;width:51px;height:31px;border-radius:999px;background:var(--sw-off);transition:background .25s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .25s var(--ease)}
.sw[aria-checked=true]{background:#34C759}
.sw[aria-checked=true]::after{transform:translateX(20px)}
.seg{display:flex;background:var(--surface2);border-radius:12px;padding:3px}
.seg button{flex:1;height:38px;border-radius:9px;font-weight:600;font-size:14.5px;color:var(--text2)}
.seg button[aria-pressed=true]{background:var(--bg);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.2)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--bar);-webkit-backdrop-filter:blur(18px) saturate(180%);backdrop-filter:blur(18px) saturate(180%);border-top:.5px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom));display:flex;justify-content:center;gap:2px}
nav.tabs button{flex:1;max-width:160px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 4px;border-radius:12px;font-size:11.5px;font-weight:600;color:var(--text3)}
nav.tabs button{position:relative}
nav.tabs button svg{width:24px;height:24px}
.bdg{position:absolute;top:1px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--pink-fill);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center}
.bdg:empty{display:none}
.code{display:inline-block;font:600 12px/1 ui-monospace,Menlo,monospace;letter-spacing:.04em;padding:3px 7px;border-radius:6px;background:var(--surface2);color:var(--text);margin-bottom:3px}
.ord .oi{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:.5px solid var(--line)}
.th.sm{width:44px;height:55px;border-radius:10px}
.ord .acts{display:flex;gap:8px;margin-top:12px}
.ord .acts .btn{flex:1}
.vend{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--text2);white-space:nowrap}
.vend input{width:18px;height:18px;accent-color:var(--pink-fill)}
.tema .dot{width:14px;height:14px}
.tema .fechas{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tag.pend{background:var(--warn-bg);color:var(--warn)}
nav.tabs button[aria-current=true]{color:var(--pink-text);background:rgba(230,0,126,.1)}
.scrim{position:fixed;inset:0;z-index:50;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity .3s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;max-height:94dvh;overscroll-behavior:contain;display:flex;flex-direction:column;background:var(--sheet);border-radius:20px 20px 0 0;box-shadow:0 -10px 50px rgba(0,0,0,.3);transform:translateY(105%);transition:transform .45s var(--ease)}
.sheet.on{transform:none}
.sheet .in{max-width:760px;width:100%;margin:0 auto;display:flex;flex-direction:column;min-height:0}
.sheet header{display:flex;align-items:center;gap:10px;padding:16px 16px 10px}
.sheet header h2{flex:1;margin:0;font-size:30px}
.sheet .body{overflow-y:auto;padding:4px 16px 16px;-webkit-overflow-scrolling:touch}
.sheet footer{display:flex;gap:10px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));border-top:.5px solid var(--line)}
.sheet footer .btn{flex:1}
.x{width:40px;height:40px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;font-size:18px;line-height:1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.media{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.mt{position:relative;aspect-ratio:4/5;border-radius:12px;overflow:hidden;background:var(--art-bg)}
.mt img,.mt video{width:100%;height:100%;object-fit:cover}
.mt .vb{position:absolute;left:6px;top:6px;font-size:10.5px;font-weight:700;background:rgba(0,0,0,.65);color:#fff;padding:2px 7px;border-radius:999px;letter-spacing:.05em}
.mt .cv{position:absolute;left:6px;bottom:6px;font-size:10.5px;font-weight:700;background:var(--pink);color:#fff;padding:2px 7px;border-radius:999px}
.mt .ac{position:absolute;right:5px;top:5px;display:flex;flex-direction:column;gap:5px}
.mt .ac button{width:28px;height:28px;border-radius:50%;background:rgba(0,0,0,.65);color:#fff;font-size:13px;display:grid;place-items:center}
.preview{background:var(--bg);border-radius:14px;padding:12px;white-space:pre-wrap;font-size:14.5px;line-height:1.4;color:var(--green);box-shadow:inset 0 0 0 .5px var(--line)}
.pchips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.pchip{font-size:12.5px;font-weight:600;padding:5px 10px;border-radius:999px;background:rgba(230,0,126,.12);color:var(--pink-text);font-family:ui-monospace,Menlo,monospace}
#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));z-index:80;transform:translate(-50%,40px);opacity:0;padding:12px 18px;border-radius:999px;background:var(--toast);color:var(--toast-text);box-shadow:0 8px 30px rgba(0,0,0,.35);font-size:15px;font-weight:500;max-width:92vw;text-align:center;transition:transform .4s var(--ease),opacity .4s var(--ease);pointer-events:none}
#toast.on{transform:translate(-50%,0);opacity:1}
#toast.err{background:#B3261E;color:#fff}
#busy{position:fixed;inset:0;z-index:90;background:var(--scrim);display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;font-weight:600;color:#fff}
#busy.on{display:flex}
.spin{width:38px;height:38px;border-radius:50%;border:4px solid rgba(255,255,255,.25);border-top-color:#fff;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.empty{text-align:center;color:var(--text3);padding:40px 10px}
.cat{display:grid;gap:10px;grid-template-columns:1fr}
.cat .top{display:flex;gap:8px;align-items:center}
.cat .top input{flex:1}
.dot{width:26px;height:26px;border-radius:50%;flex:none}
input[type=color]{width:42px;height:38px;padding:2px;border-radius:10px;background:var(--bg);border:0;flex:none;cursor:pointer}
.note{font-size:13px;color:var(--text3);margin-top:12px}
.linkrow{display:flex;gap:14px;flex-wrap:wrap;margin-top:6px;font-size:13.5px}
.cr{display:flex;gap:8px;align-items:center}
.cr input[type=text]{flex:1}
.pv{display:flex;gap:14px;align-items:center}
.pv .th{width:72px;height:90px}
.dialog{position:fixed;inset:0;z-index:100;background:var(--scrim);display:flex;align-items:center;justify-content:center;padding:20px}
@media (min-width:700px){.sheet{left:50%;right:auto;width:640px;transform:translate(-50%,105%);border-radius:20px 20px 0 0}.sheet.on{transform:translate(-50%,0)}}
#login{position:fixed;inset:0;z-index:120;background:var(--bg);display:none;align-items:center;justify-content:center;padding:24px;text-align:center}
#login.on{display:flex}
#login .box{max-width:360px;width:100%;display:flex;flex-direction:column;align-items:center;gap:14px}
#login .logo-big{width:200px;aspect-ratio:1652/1008;background:var(--text);-webkit-mask:url(../marca/logo.png) center/contain no-repeat;mask:url(../marca/logo.png) center/contain no-repeat}
#login p{color:var(--text2);font-size:15px;line-height:1.45}
#login .err{color:var(--red);font-size:14px;min-height:20px}
#gbtn{min-height:44px;width:280px;margin:0 auto;display:flex;justify-content:center;color-scheme:light;background:transparent;border-radius:999px;overflow:hidden}
#gbtn iframe{color-scheme:light;background:transparent!important;margin:0!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <div class="logo" role="img" aria-label="Sowy Showroom, panel de servicio"><i></i><small>Panel de servicio</small></div>
  <div class="sp"></div>
  <button class="btn sm icon" id="theme-btn" type="button" aria-label="Cambiar de tema"><svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5Z"/></svg><svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6 7 7M17 17l1.4 1.4M5.6 18.4 7 17M17 7l1.4-1.4"/></svg></button>
  <a class="btn sm" id="lnk-site" href="../" target="_blank" rel="noopener">Ver tienda</a>
  <button class="btn sm" id="btn-out" type="button" title="Cerrar sesión" aria-label="Cerrar sesión" hidden>Salir</button>
</div></header>
<main><div class="wrap" id="view"></div></main>
<div id="login" role="dialog" aria-modal="true" aria-label="Ingresar"><div class="box">
  <div class="logo-big" role="img" aria-label="Sowy Showroom"></div>
  <p>Ingresá con la cuenta de Google del negocio para administrar prendas, ofertas y mensajes.</p>
  <div id="gbtn"></div>
  <div class="err" id="login-err"></div>
  <p style="font-size:12.5px;color:var(--text3)">Solo tiene acceso la cuenta autorizada.</p>
</div></div>

<nav class="tabs" id="tabs" aria-label="Secciones">
  <button type="button" data-tab="prod" aria-current="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4 4 6.5 2.5 10 6 11.5V20h12v-8.5l3.5-1.5L20 6.5 15 4q-1.5 2-3 2T9 4Z"/></svg>Prendas</button>
  <button type="button" data-tab="ped"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 8h14l-1 12H6L5 8Z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>Pedidos<span class="bdg" id="bdg-ped" aria-label="pedidos pendientes"></span></button>
  <button type="button" data-tab="cat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="7" height="7" rx="2"/><rect x="13" y="4" width="7" height="7" rx="2"/><rect x="4" y="13" width="7" height="7" rx="2"/><rect x="13" y="13" width="7" height="7" rx="2"/></svg>Categorías</button>
  <button type="button" data-tab="tem"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 10h16M8 3v4M16 3v4"/></svg>Temas</button>
  <button type="button" data-tab="mas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="18" cy="12" r="1.4"/></svg>Más</button>
</nav>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title"><div class="in">
  <header><h2 id="sheet-title"></h2><button class="x" id="sheet-x" type="button" aria-label="Cerrar">✕</button></header>
  <div class="body" id="sheet-body"></div>
  <footer id="sheet-foot"></footer>
</div></div>
<div id="toast" role="status"></div>
<div id="busy"><div class="spin"></div><div id="busy-t">Trabajando…</div></div>

<script src="../arte.js"></script>
<script>
'use strict';
var S = null, TAB = 'prod', F = { q: '', cat: '', chip: 'all' }, CLOSE_CB = null, VIEW = '#view', MAS = 'msg', OF = 'Pendiente', TEM = null;
var ICONS = [['remera','Remera'],['buzo','Buzo'],['campera','Campera'],['pantalon','Pantalón / jean'],['vestido','Vestido'],['pollera','Pollera / short'],['gorra','Gorra'],['cartera','Cartera / bolso'],['zapatilla','Zapatillas'],['percha','Conjuntos / looks'],['estrella','Estrella']];
var PRESETS_TALLES = { letras: ['XS','S','M','L','XL'], numeros: ['34','36','38','40','42','44'], unico: ['Único'] };
var COLORES_RAPIDOS = [{ n: 'Negro', h: '#111113' }, { n: 'Blanco', h: '#FFFFFF' }, { n: 'Fucsia', h: '#E6007E' }];
var AR = window.SowyArt;

/* ---------- utilidades ---------- */
function $(s, r){ return (r || document).querySelector(s); }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function money(n){ return n == null || n === '' ? '—' : '$' + Math.round(n).toLocaleString('es-AR'); }
function cap(s){ s = String(s == null ? '' : s).trim(); return s ? s.charAt(0).toUpperCase() + s.slice(1) : s; }
function ref_(p){ return p.precio == null ? null : (p.oferta > 0 ? p.precio : (p.lista > p.precio ? p.lista : null)); }
function pct_(p){ return p.oferta > 0 ? p.oferta : (ref_(p) ? Math.round((1 - p.precio / p.lista) * 100) : 0); }
function final_(p){ return p.precio == null ? null : (p.oferta > 0 ? Math.round(p.precio * (1 - p.oferta / 100)) : p.precio); }
function imgUrl(f){ return /\.(jpe?g|png|webp|gif|avif)$/i.test(f) ? '/fotos/' + encodeURIComponent(f) : 'https://lh3.googleusercontent.com/d/' + f + '=w300'; }
function artOf(p, uid){ return AR.art(p.forma, (p.colores && p.colores[0] && p.colores[0].h) || '#111113', uid, 'slice'); }
function thumbOf(p, uid){ return p.fotos && p.fotos[0] ? '<img loading="lazy" referrerpolicy="no-referrer" src="' + esc(imgUrl(p.fotos[0])) + '" alt="">' : artOf(p, uid); }

/* ---------- conexión con el backend ----------
   Local: server.py responde en /api (sin login). Publicado: poner acá la URL de Apps Script y el ID de cliente de Google. */
var APPS_URL = 'https://script.google.com/macros/s/AKfycbw_nJ8LZGCmj8wu1JiVGBqV0n2moc6p65CDxnT6wSFGOmSsijAcwsKU9XafSNhPKh8YsA/exec';
var CLIENT_ID = '571871934534-41idsg0uloc6r2s2flhcte8tafbhrvrs.apps.googleusercontent.com';
var EN_MI_MAC = /^(localhost|127\.0\.0\.1)$/.test(location.hostname);
var LOCAL = EN_MI_MAC;      // solo en tu Mac se usa el servidor local; publicado, exige el backend de Google
var API = LOCAL ? '/api' : APPS_URL;
var TOKEN = '', waiters = [], gsiOk = false, lastAct = Date.now(), IDLE_MS = 15 * 60 * 1000;
try { sessionStorage.removeItem('sowy_tk'); } catch(e){}   // la sesión vive solo en memoria: al recargar hay que volver a entrar
function tokenOk(t){
  if(LOCAL) return true;
  try { var p = JSON.parse(atob(t.split('.')[1].replace(/-/g, '+').replace(/_/g, '/'))); return p.exp * 1000 > Date.now() + 60000; } catch(e){ return false; }
}
function showLogin(msg){
  $('#login').classList.add('on'); $('#login-err').textContent = msg || '';
  try { google.accounts.id.disableAutoSelect(); } catch(e){}
}
function onCred(resp){
  TOKEN = resp.credential;
  lastAct = Date.now();
  $('#login').classList.remove('on');
  var w = waiters; waiters = []; w.forEach(function(f){ f(); });
  if(!S) start();
}
function gsiReady(){
  gsiOk = true;
  google.accounts.id.initialize({ client_id: CLIENT_ID, callback: onCred, auto_select: false, cancel_on_tap_outside: false });
  google.accounts.id.renderButton($('#gbtn'), { theme: 'filled_black', size: 'large', shape: 'pill', text: 'signin_with', locale: 'es', width: 280 });
  if(!tokenOk(TOKEN)){ showLogin(''); }
}
if(!LOCAL && APPS_URL){
  var gs = document.createElement('script'); gs.src = 'https://accounts.google.com/gsi/client'; gs.async = true; gs.onload = gsiReady; document.head.appendChild(gs);
  $('#btn-out').hidden = false;
}
function ensureLogin(){
  if(tokenOk(TOKEN)) return Promise.resolve();
  return new Promise(function(ok){ waiters.push(ok); showLogin('Tu sesión venció. Volvé a ingresar.'); });
}
function call(fn){
  var args = Array.prototype.slice.call(arguments, 1);
  return ensureLogin().then(function(){
    return fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(LOCAL ? { action: fn, args: args } : { token: TOKEN, action: fn, args: args }) });
  }).then(function(r){ return r.json(); }).then(function(j){
    if(!j.ok){
      if(/^auth:/.test(j.error)){ TOKEN = ''; try { sessionStorage.removeItem('sowy_tk'); } catch(e){} showLogin(j.error.slice(5)); }
      throw new Error(String(j.error).replace(/^auth:/, ''));
    }
    return j.data;
  }, function(){ throw new Error('No hay conexión con el servidor. Revisá tu internet.'); });
}
['pointerdown','keydown','touchstart'].forEach(function(ev){ document.addEventListener(ev, function(){ lastAct = Date.now(); }, { passive: true }); });
setInterval(function(){
  if(LOCAL || !TOKEN) return;
  if(Date.now() - lastAct > IDLE_MS){ TOKEN = ''; S = null; $('#view').innerHTML = ''; showLogin('Cerramos tu sesión por inactividad. Volvé a ingresar.'); }
}, 30000);
$('#btn-out').onclick = function(){
  TOKEN = ''; S = null; try { sessionStorage.removeItem('sowy_tk'); } catch(e){}
  try { google.accounts.id.disableAutoSelect(); } catch(e){}
  $('#view').innerHTML = ''; showLogin('');
};
var tt;
function toast(msg, err){ var t = $('#toast'); t.textContent = msg; t.className = 'on' + (err ? ' err' : ''); clearTimeout(tt); tt = setTimeout(function(){ t.className = ''; }, err ? 5200 : 2600); }
function busy(on, txt){ $('#busy').classList.toggle('on', !!on); if(txt) $('#busy-t').textContent = txt; }
async function run(label, fn){
  busy(true, label);
  try { return await fn(); }
  catch(e){ toast(e.message || 'Algo salió mal', true); throw e; }
  finally { busy(false); }
}
function confirmBox(msg, okLabel, danger){
  return new Promise(function(res){
    var d = document.createElement('div');
    d.className = 'dialog';
    d.innerHTML = '<div class="card" role="alertdialog" aria-modal="true" style="max-width:380px;width:100%;background:var(--sheet)"><p style="font-size:16px;margin-bottom:16px">' + msg + '</p><div class="row"><button class="btn" data-r="0" style="flex:1">Cancelar</button><button class="btn ' + (danger ? 'danger' : 'primary') + '" data-r="1" style="flex:1">' + esc(okLabel || 'Aceptar') + '</button></div></div>';
    d.addEventListener('click', function(e){ var b = e.target.closest('[data-r]'); if(b){ d.remove(); res(b.dataset.r === '1'); } else if(e.target === d){ d.remove(); res(false); } });
    document.body.appendChild(d);
  });
}

/* ---------- hoja inferior (editor) ---------- */
function openSheet(title, body, foot, onClose){
  $('#sheet-title').textContent = title;
  $('#sheet-body').innerHTML = body;
  $('#sheet-foot').innerHTML = foot || '';
  $('#sheet-foot').style.display = foot ? 'flex' : 'none';
  $('#scrim').classList.add('on'); $('#sheet').classList.add('on');
  CLOSE_CB = onClose || null;
  $('#sheet-body').scrollTop = 0;
}
function closeSheet(){ $('#scrim').classList.remove('on'); $('#sheet').classList.remove('on'); if(CLOSE_CB){ var f = CLOSE_CB; CLOSE_CB = null; f(); } }
$('#scrim').addEventListener('click', closeSheet);
$('#sheet-x').addEventListener('click', closeSheet);
document.addEventListener('keydown', function(e){ if(e.key === 'Escape') closeSheet(); });

/* ---------- navegación ---------- */
$('#tabs').addEventListener('click', function(e){
  var b = e.target.closest('[data-tab]'); if(!b) return;
  TAB = b.dataset.tab;
  [].forEach.call(document.querySelectorAll('#tabs button'), function(x){ x.setAttribute('aria-current', x === b ? 'true' : 'false'); });
  if(TAB === 'ped') refrescar();
  render(); window.scrollTo(0, 0);
});
function render(){
  if(!S){ $('#view').innerHTML = '<div class="empty">Cargando…</div>'; return; }
  badgePedidos();
  ({ prod: viewProd, ped: viewPed, cat: viewCat, tem: viewTem, mas: viewMas })[TAB]();
}

/* ================= PRENDAS (cada una es una pieza única) ================= */
var TIPOS_BASE = ['Remera', 'Top', 'Buzo', 'Campera', 'Jean', 'Pantalón', 'Short', 'Vestido', 'Pollera', 'Gorra', 'Cartera', 'Medias'];
function estadoTag(p){
  if(!p.disponible) return '<span class="tag bad">Vendida</span>';
  if(p.colores.length > 1) return '<span class="tag ok">Disponible · ' + p.coloresLibres.length + ' de ' + p.colores.length + ' colores</span>';
  return '<span class="tag ok">Disponible</span>';
}
function viewProd(){
  var cats = S.categorias.map(function(c){ return c.nombre; });
  var q = F.q.toLowerCase();
  var list = S.productos.filter(function(p){
    if(q && (p.nombre + ' ' + p.categoria + ' ' + p.codigo + ' ' + (p.tipo || '')).toLowerCase().indexOf(q) < 0) return false;
    if(F.cat && p.categoria !== F.cat) return false;
    if(F.chip === 'dis') return p.disponible;
    if(F.chip === 'ven') return !p.disponible;
    if(F.chip === 'of') return pct_(p) > 0;
    if(F.chip === 'np') return p.precio == null;
    if(F.chip === 'oc') return !p.visible;
    return true;
  });
  var cnt = { dis: 0, ven: 0, of: 0, np: 0, oc: 0 };
  S.productos.forEach(function(p){ if(p.disponible) cnt.dis++; else cnt.ven++; if(pct_(p) > 0) cnt.of++; if(p.precio == null) cnt.np++; if(!p.visible) cnt.oc++; });
  var chip = function(k, t){ return '<button class="chip" data-chip="' + k + '" aria-pressed="' + (F.chip === k) + '">' + t + '</button>'; };
  var h = '<div class="row" style="margin-bottom:10px"><div style="flex:1"><h2>Prendas</h2><div class="hint">' + S.productos.length + ' piezas · tocá una para editarla</div></div><button class="btn primary" id="p-new" type="button">＋ Nueva</button></div>' +
    '<div class="stack" style="margin-bottom:12px"><input type="search" id="p-q" placeholder="Buscar por nombre o código (ej: E001)…" aria-label="Buscar prenda" value="' + esc(F.q) + '">' +
    '<select id="p-cat" aria-label="Categoría"><option value="">Todas las categorías</option>' + cats.map(function(c){ return '<option' + (F.cat === c ? ' selected' : '') + '>' + esc(c) + '</option>'; }).join('') + '</select>' +
    '<div class="chips">' + chip('all', 'Todas') + chip('dis', 'Disponibles (' + cnt.dis + ')') + chip('ven', 'Vendidas (' + cnt.ven + ')') + chip('of', 'Ofertas (' + cnt.of + ')') + chip('np', 'Sin precio (' + cnt.np + ')') + chip('oc', 'Ocultas (' + cnt.oc + ')') + '</div></div>';
  if(!list.length) h += '<div class="empty">No hay prendas con ese filtro.</div>';
  else h += '<div class="list">' + list.map(function(p){
    var f = final_(p);
    return '<div class="prod' + (p.visible && p.disponible ? '' : ' off') + '" role="button" tabindex="0" aria-label="Editar ' + esc(p.codigo) + ' ' + esc(cap(p.nombre)) + '" data-id="' + esc(p.id) + '">' +
      '<div class="th">' + thumbOf(p, 'l' + esc(p.id)) + '</div>' +
      '<div class="info"><span class="code">' + esc(p.codigo) + '</span><b>' + esc(cap(p.nombre)) + '</b><small>' + esc(p.categoria) + (p.tipo ? ' · ' + esc(p.tipo) : '') + (p.talle ? ' · talle ' + esc(p.talle) : '') + '</small><div class="tags">' + estadoTag(p) + (pct_(p) > 0 ? '<span class="tag of">Oferta −' + pct_(p) + '%</span>' : '') + (p.precio == null ? '<span class="tag bad">Sin precio</span>' : '') + (!p.fotos.length ? '<span class="tag">Sin foto</span>' : '') + (p.videos.length ? '<span class="tag">▶ video</span>' : '') + '</div></div>' +
      '<div class="price">' + (ref_(p) != null ? '<s>' + money(ref_(p)) + '</s>' : '') + (f == null ? '' : money(f)) + '</div>' +
      '<button class="sw" role="switch" aria-checked="' + p.visible + '" aria-label="Visible en la tienda" data-vis="' + esc(p.id) + '"></button></div>';
  }).join('') + '</div>';
  $(VIEW).innerHTML = h;
  $('#p-new').onclick = function(){ editProduct(null); };
  $('#p-q').oninput = function(e){ F.q = e.target.value; var pos = e.target.selectionStart; viewProd(); var i = $('#p-q'); i.focus(); i.setSelectionRange(pos, pos); };
  $('#p-cat').onchange = function(e){ F.cat = e.target.value; viewProd(); };
  [].forEach.call(document.querySelectorAll('[data-chip]'), function(b){ b.onclick = function(){ F.chip = b.dataset.chip; viewProd(); }; });
  [].forEach.call(document.querySelectorAll('.prod'), function(el){ el.onkeydown = function(e){ if((e.key === 'Enter' || e.key === ' ') && e.target === el){ e.preventDefault(); editProduct(el.dataset.id); } }; el.onclick = function(e){
    var v = e.target.closest('[data-vis]');
    if(v){ e.stopPropagation(); toggleVisible(v.dataset.vis); return; }
    editProduct(el.dataset.id);
  }; });
}
async function toggleVisible(id){
  var p = S.productos.filter(function(x){ return x.id === id; })[0]; if(!p) return;
  try { S = await run('Guardando…', function(){ return call('api_quick', id, 'visible', !p.visible); }); render(); toast(p.visible ? 'Visible en la tienda' : 'Oculta en la tienda'); } catch(e){}
}

function colorRow(c, sold){        // sold: '' | 'manual' | 'pedido'
  var ctrl = sold === 'pedido' ? '<span class="tag bad">Vendido en un pedido</span>'
    : '<label class="vend"><input type="checkbox" data-vend' + (sold === 'manual' ? ' checked' : '') + '> Vendido</label>';
  return '<div class="cr" data-sold="' + sold + '"><input type="color" value="' + esc(c.h) + '" aria-label="Color"' + (sold === 'pedido' ? ' disabled' : '') + '><input type="text" value="' + esc(c.n) + '" placeholder="Nombre (ej: Negro)" maxlength="30" aria-label="Nombre del color"' + (sold === 'pedido' ? ' disabled' : '') + '>' + ctrl +
    '<button class="btn sm danger" type="button" data-crm aria-label="Quitar color"' + (sold === 'pedido' ? ' disabled' : '') + '>✕</button></div>';
}
function proxPieza(modelo, excepto){
  var n = 0;
  S.productos.forEach(function(x){ if(x.id !== excepto && String(x.modelo).toLowerCase() === modelo.toLowerCase() && x.pieza > n) n = x.pieza; });
  return n + 1;
}
function editProduct(id){
  var p = id ? S.productos.filter(function(x){ return x.id === id; })[0] : null;
  var isNew = !p;
  p = p || { modelo: '', pieza: 0, nombre: '', categoria: F.cat || (S.categorias[0] && S.categorias[0].nombre) || '', tipo: '', talle: '', costo: null, precio: null, lista: null, oferta: 0, descripcion: '', visible: true, fotos: [], videos: [], colores: [], ventas: {}, forma: 'remera' };
  var catOpts = S.categorias.map(function(c){ return '<option' + (c.nombre === p.categoria ? ' selected' : '') + '>' + esc(c.nombre) + '</option>'; }).join('') + '<option value="__new">＋ Nueva categoría…</option>';
  var formaOpts = AR.formas.map(function(f){ return '<option value="' + f[0] + '"' + (f[0] === p.forma ? ' selected' : '') + '>' + f[1] + '</option>'; }).join('');
  var tipos = TIPOS_BASE.slice(); S.productos.forEach(function(x){ if(x.tipo && tipos.indexOf(x.tipo) < 0) tipos.push(x.tipo); });
  var ventas = p.ventas || {};
  var talleChips = ['XS', 'S', 'M', 'L', 'XL', '34', '36', '38', '40', '42', '44', 'Único'].map(function(t){ return '<button class="btn sm" type="button" data-tq="' + t + '">' + t + '</button>'; }).join('');
  var body =
    '<div class="stack">' +
    '<div><label class="l" for="f-modelo">Código de modelo · solo se ve en el panel</label><input type="text" id="f-modelo" value="' + esc(p.modelo) + '" maxlength="12" placeholder="Ej: E001" autocapitalize="characters" autocomplete="off" spellcheck="false"><div class="hint" id="f-pieza" style="margin-top:4px"></div></div>' +
    '<div><label class="l" for="f-nombre">Nombre</label><input type="text" id="f-nombre" value="' + esc(cap(p.nombre)) + '" maxlength="120" placeholder="Ej: Jean estrellado"></div>' +
    '<div class="grid2"><div><label class="l" for="f-cat">Categoría</label><select id="f-cat">' + catOpts + '</select></div>' +
    '<div><label class="l" for="f-tipo">Tipo de prenda</label><input type="text" id="f-tipo" list="f-tipos" value="' + esc(p.tipo || '') + '" maxlength="40" placeholder="Ej: Jean"><datalist id="f-tipos">' + tipos.map(function(t){ return '<option value="' + esc(t) + '">'; }).join('') + '</datalist></div></div>' +
    '<input type="text" id="f-newcat" placeholder="Nombre de la nueva categoría" aria-label="Nueva categoría" maxlength="60" style="display:none">' +
    '<div><label class="l" for="f-talle">Talle (uno solo: la pieza es única)</label><input type="text" id="f-talle" value="' + esc(p.talle || '') + '" maxlength="12" placeholder="Ej: M, 38 o Único"><div class="row wrapx" style="margin-top:8px">' + talleChips + '</div></div>' +
    '<div><label class="l">Color</label><div class="stack" id="f-colores" style="gap:8px">' + (p.colores || []).map(function(c){ var v = ventas[c.n]; return colorRow(c, v ? (v === 'manual' ? 'manual' : 'pedido') : ''); }).join('') + '</div>' +
      '<div class="row wrapx" style="margin-top:8px"><button class="btn sm" type="button" id="f-cadd">＋ Color</button>' + COLORES_RAPIDOS.map(function(c, i){ return '<button class="btn sm" type="button" data-cq="' + i + '"><span class="dot" style="width:14px;height:14px;background:' + c.h + ';box-shadow:inset 0 0 1px rgba(128,128,128,.8)"></span>' + c.n + '</button>'; }).join('') + '</div>' +
      '<div class="hint" style="margin-top:6px">Poné un solo color. Agregá más solo si es <b>la misma prenda en varios colores</b>: cada color se vende una vez y la clienta elige cuál.</div></div>' +
    '<div class="card" id="w-vend0" style="padding:12px;display:none"><div class="row"><div style="flex:1"><b>Pieza vendida</b><div class="hint">Márcala si la vendiste por fuera de la tienda: sale de la tienda.</div></div><button class="sw" id="f-vend0" type="button" role="switch" aria-label="Pieza vendida" aria-checked="' + (!!ventas._) + '"></button></div></div>' +
    '<div class="grid2"><div><label class="l" for="f-precio">Precio de venta ($)</label><input type="number" id="f-precio" min="0" step="1" inputmode="numeric" value="' + (p.precio == null ? '' : p.precio) + '" placeholder="Sin precio"></div>' +
    '<div><label class="l" for="f-costo">Costo ($) · privado</label><input type="number" id="f-costo" min="0" step="1" inputmode="numeric" value="' + (p.costo == null ? '' : p.costo) + '"></div></div>' +
    '<div><label class="l" for="f-lista">Precio de lista ($)</label><input type="number" id="f-lista" min="0" step="1" inputmode="numeric" value="' + (p.lista == null ? '' : p.lista) + '" placeholder="Opcional"><div class="hint" style="margin-top:4px">Si es mayor al de venta, se muestra tachado en la tienda.</div></div>' +
    '<div class="card" style="padding:12px"><div class="row"><div style="flex:1"><b>Oferta</b><div class="hint">Tacha el precio y muestra la banda de descuento</div></div><button class="sw" id="f-of-sw" type="button" role="switch" aria-label="Oferta" aria-checked="' + (p.oferta > 0) + '"></button></div>' +
    '<div id="w-of" style="margin-top:10px;display:' + (p.oferta > 0 ? 'block' : 'none') + '"><div class="row"><div style="width:120px"><label class="l" for="f-of">Descuento %</label><input type="number" id="f-of" min="1" max="95" step="1" inputmode="numeric" value="' + (p.oferta > 0 ? p.oferta : 10) + '"></div><div id="f-ofprev" class="hint" style="flex:1;font-size:14px"></div></div></div></div>' +
    '<div><label class="l" for="f-desc">Descripción</label><textarea id="f-desc" maxlength="1500" placeholder="Tela, calce, cuidados… Se muestra en la ventana de la prenda.">' + esc(p.descripcion) + '</textarea></div>' +
    '<div><label class="l" for="f-forma">Ilustración (se usa mientras no haya foto)</label><div class="pv"><div class="th" id="f-pv"></div><select id="f-forma" style="flex:1">' + formaOpts + '</select></div></div>' +
    '<div class="row"><div style="flex:1"><b>Visible en la tienda</b></div><button class="sw" id="f-vis" type="button" role="switch" aria-label="Visible en la tienda" aria-checked="' + p.visible + '"></button></div>' +
    '<div id="w-media"></div>' +
    (isNew ? '' : '<button class="btn danger" id="f-del" type="button">Eliminar prenda</button>') +
    '</div>';
  var foot = '<button class="btn" id="f-cancel" type="button">Cancelar</button><button class="btn primary" id="f-save" type="button">Guardar</button>';
  openSheet(isNew ? 'Nueva prenda' : 'Editar · ' + p.codigo, body, foot);
  var st = { of: p.oferta > 0, vis: p.visible, vend0: !!ventas._ };
  function colores(){
    var out = [];
    [].forEach.call(document.querySelectorAll('#f-colores .cr'), function(r){ var n = r.querySelector('input[type=text]').value.trim(); if(n) out.push({ n: n, h: r.querySelector('input[type=color]').value.toUpperCase() }); });
    return out;
  }
  function vendidos(){
    var out = [];
    [].forEach.call(document.querySelectorAll('#f-colores .cr'), function(r){ var n = r.querySelector('input[type=text]').value.trim(); var cb = r.querySelector('[data-vend]'); if(n && cb && cb.checked) out.push(n); });
    if(!colores().length && st.vend0) out.push('_');
    return out;
  }
  function pv(){ $('#f-pv').innerHTML = AR.art($('#f-forma').value, (colores()[0] || { h: '#111113' }).h, 'ed', 'slice'); }
  function pieza(){
    var m = $('#f-modelo').value.trim().toUpperCase();
    $('#f-pieza').textContent = !m ? 'El panel le suma un número a cada pieza del modelo: E001-1, E001-2, E001-3…'
      : (!isNew && m.toLowerCase() === String(p.modelo).toLowerCase() ? 'Esta pieza: ' + p.codigo : 'Esta pieza va a ser ' + m + '-' + proxPieza(m, p.id));
  }

/* ---------- subida de archivos (por pedazos) ---------- */
function loadImage(file){
  return new Promise(function(ok, no){
    var url = URL.createObjectURL(file), img = new Image();
    img.onload = function(){ ok({ img: img, url: url }); };
    img.onerror = function(){ URL.revokeObjectURL(url); no(new Error('No pude leer la imagen. Si es HEIC, sacá la foto en JPG o convertila antes.')); };
    img.src = url;
  });
}
async function shrink(file, max, q){
  var li = await loadImage(file), img = li.img;
  var w = img.naturalWidth, h = img.naturalHeight, k = Math.min(1, max / Math.max(w, h));
  var c = document.createElement('canvas'); c.width = Math.round(w * k); c.height = Math.round(h * k);
  var ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height); ctx.drawImage(img, 0, 0, c.width, c.height);
  URL.revokeObjectURL(li.url);
  return await new Promise(function(ok, no){ c.toBlob(function(b){ b ? ok(b) : no(new Error('No pude achicar la foto.')); }, 'image/jpeg', q); });
}
function toB64(blob){
  return new Promise(function(ok, no){ var r = new FileReader(); r.onload = function(){ ok(String(r.result).split(',')[1] || ''); }; r.onerror = function(){ no(new Error('No pude leer el archivo.')); }; r.readAsDataURL(blob); });
}
async function uploadOne(p, file, n, total){
  var prog = function(t){ var e = $('#f-prog'); if(e) e.textContent = t; };
  var blob = file, name = file.name || 'archivo', mime = file.type || 'application/octet-stream';
  var isImg = mime.indexOf('image/') === 0, isVid = mime.indexOf('video/') === 0;
  if(!isImg && !isVid) throw new Error('Solo se pueden subir fotos o videos.');
  if(isImg && mime !== 'image/gif'){ prog('Achicando foto ' + n + '/' + total + '…'); blob = await shrink(file, 1800, 0.86); mime = 'image/jpeg'; name = name.replace(/\.[^.]+$/, '') + '.jpg'; }
  if(blob.size > 15 * 1024 * 1024) throw new Error('"' + name + '" pesa ' + (blob.size / 1048576).toFixed(1) + ' MB. El máximo es 15 MB.');
  var b64 = await toB64(blob);
  var sid = 'u' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  var CH = 1200000, parts = Math.max(1, Math.ceil(b64.length / CH));
  for(var i = 0; i < parts; i++){
    prog('Subiendo ' + n + '/' + total + ' · ' + Math.round((i / parts) * 100) + '%');
    await call('api_uploadChunk', sid, i, b64.slice(i * CH, (i + 1) * CH));
  }
  prog('Guardando…');
  var r = await call('api_uploadFinish', p.id, sid, parts, name, mime, blob.size);
  S = r.estado; render();
}

function fechaCorta(t){
  var d = new Date(String(t).replace(' ', 'T')), h = new Date();
  var hh = ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
  if(d.toDateString() === h.toDateString()) return 'Hoy ' + hh;
  var ay = new Date(h); ay.setDate(h.getDate() - 1);
  if(d.toDateString() === ay.toDateString()) return 'Ayer ' + hh;
  return ('0' + d.getDate()).slice(-2) + '/' + ('0' + (d.getMonth() + 1)).slice(-2) + ' ' + hh;
}

    '<div class="chips" style="margin-bottom:12px">' + chip('Pendiente', 'Pendientes (' + cnt.Pendiente + ')') + chip('Confirmado', 'Confirmados (' + cnt.Confirmado + ')') + chip('Cancelado', 'Cancelados (' + cnt.Cancelado + ')') + chip('all', 'Todos') + '</div>';
  if(!list.length) h += '<div class="empty">' + (OF === 'Pendiente' ? 'No hay pedidos pendientes.<br><span class="hint">Cuando alguien envíe su carrito por WhatsApp, aparece acá.</span>' : 'No hay pedidos en esta lista.') + '</div>';
  else h += '<div class="list">' + list.map(function(o){
    var conflicto = o.items.some(function(it){ return it.conflicto; });
    var tag = o.estado === 'Pendiente' ? '<span class="tag pend">Pendiente</span>' : (o.estado === 'Confirmado' ? '<span class="tag ok">Confirmado</span>' : '<span class="tag">Cancelado</span>');
    return '<div class="card ord" data-oid="' + esc(o.id) + '"><div class="row"><div style="flex:1"><b style="font-size:17px">Pedido #' + o.numero + '</b><div class="hint">' + fechaCorta(o.fecha) + (o.cerrado ? ' · cerrado ' + fechaCorta(o.cerrado) : '') + '</div></div>' + tag + '</div>' +
      '<div style="margin-top:8px">' + o.items.map(function(it, i){
        return '<div class="oi"><div class="th sm">' + itemThumb(it, o.numero + '_' + i) + '</div><div class="info"><span class="code">' + esc(it.codigo) + '</span><b>' + esc(cap(it.nombre)) + '</b><small>' + (it.talle ? 'Talle ' + esc(it.talle) : '') + (it.color ? ' · ' + esc(it.color) : '') + '</small>' +
          (it.conflicto ? '<div class="tags"><span class="tag bad">' + (it.existe ? 'Ya se vendió en otro pedido' : 'Ya no existe') + '</span></div>' : '') + '</div><div class="price">' + money(it.precio) + '</div></div>';
      }).join('') + '</div>' +
      '<div class="row" style="justify-content:space-between;border-top:.5px solid var(--line);padding-top:10px"><span class="hint">Total</span><b style="font-size:19px">' + money(o.total) + '</b></div>' +
      (o.estado === 'Pendiente'
        ? (conflicto ? '<div class="hint" style="margin-top:8px;color:var(--red)">Hay prendas que ya no están disponibles. Cancelá el pedido o avisale a la persona.</div>' : '') +
          '<div class="acts"><button class="btn danger" data-cancel="' + esc(o.id) + '" type="button">Cancelar</button><button class="btn primary" data-confirm="' + esc(o.id) + '" type="button"' + (conflicto ? ' disabled' : '') + '>Confirmar</button></div>'
        : '<div class="acts"><button class="btn" data-reopen="' + esc(o.id) + '" type="button">Volver a pendiente</button></div>') + '</div>';
  }).join('') + '</div>';
  $(VIEW).innerHTML = h;
  $('#o-ref').onclick = async function(){ await run('Actualizando…', refrescar); toast('Pedidos actualizados'); };
  [].forEach.call(document.querySelectorAll('[data-of]'), function(b){ b.onclick = function(){ OF = b.dataset.of; viewPed(); }; });
  function orden(id){ return S.pedidos.filter(function(o){ return o.id === id; })[0]; }
  [].forEach.call(document.querySelectorAll('[data-confirm]'), function(b){ b.onclick = async function(){
    var o = orden(b.dataset.confirm);
    if(!(await confirmBox('¿Confirmar el <b>pedido #' + o.numero + '</b>?<br><span class="hint">Las prendas se marcan como vendidas y salen de la tienda.</span>', 'Confirmar'))) return;
    try { S = await run('Confirmando…', function(){ return call('api_confirmOrder', o.id); }); render(); toast('Pedido #' + o.numero + ' confirmado: las prendas salieron de la tienda'); } catch(e){}
  }; });
  [].forEach.call(document.querySelectorAll('[data-cancel]'), function(b){ b.onclick = async function(){
    var o = orden(b.dataset.cancel);
    if(!(await confirmBox('¿Cancelar el <b>pedido #' + o.numero + '</b>?<br><span class="hint">Las prendas siguen disponibles en la tienda.</span>', 'Cancelar pedido', true))) return;
    try { S = await run('Cancelando…', function(){ return call('api_cancelOrder', o.id); }); render(); toast('Pedido #' + o.numero + ' cancelado'); } catch(e){}
  }; });
  [].forEach.call(document.querySelectorAll('[data-reopen]'), function(b){ b.onclick = async function(){
    var o = orden(b.dataset.reopen);
    if(!(await confirmBox('¿Volver el <b>pedido #' + o.numero + '</b> a pendiente?' + (o.estado === 'Confirmado' ? '<br><span class="hint">Las prendas que había vendido vuelven a estar disponibles.</span>' : ''), 'Volver a pendiente'))) return;
    try { S = await run('Guardando…', function(){ return call('api_reopenOrder', o.id); }); OF = 'Pendiente'; render(); toast('Pedido #' + o.numero + ' vuelve a pendiente'); } catch(e){}
  }; });
}
setInterval(function(){ if(S && TAB === 'ped' && !document.hidden && !$('#sheet').classList.contains('on') && !document.querySelector('.dialog')) refrescar(); }, 45000);

/* ================= TEMAS (por fecha) ================= */
var TEMA_COLOR = { sanvalentin: '#D6004F', madre: '#C2338A', halloween: '#E8590C', blackfriday: '#B8860B', navidad: '#C8102E' };
function enVentana(t, hoy){
  var f = function(x){ var a = String(x).split('/'); return (+a[1] || 0) * 100 + (+a[0] || 0); };
  var a = f(t.desde), b = f(t.hasta), h = (hoy.getMonth() + 1) * 100 + hoy.getDate();
  return a <= b ? (h >= a && h <= b) : (h >= a || h <= b);
}
function temaHoy(lista){
  var on = lista.filter(function(t){ return t.modo === 'on'; })[0];
  return on || lista.filter(function(t){ return t.modo === 'auto' && enVentana(t, new Date()); })[0] || null;
}
function readTem(){
  [].forEach.call(document.querySelectorAll('.tema'), function(el){
    var t = TEM[+el.dataset.i];
    t.desde = el.querySelector('[data-k=desde]').value.trim(); t.hasta = el.querySelector('[data-k=hasta]').value.trim(); t.cartel = el.querySelector('[data-k=cartel]').value.trim();
  });
}
function viewTem(){
  if(!TEM) TEM = S.temas.map(function(t){ return Object.assign({}, t); });
  var hoy = temaHoy(TEM);
  var h = '<h2>Temas</h2><div class="hint" style="margin-bottom:12px">Cambian el color de acento, el cartel de la portada y agregan decoración y un efecto (guirnaldas, caramelos, corazones…) a la tienda. <b>Según la fecha</b> se prenden solos en su ventana; <b>Activado</b> lo prende ya, aunque no sea la fecha.</div>' +
    '<div class="card" style="margin-bottom:14px"><b>Hoy la tienda se ve:</b> ' + (hoy ? '<span class="tag ok">' + esc(hoy.nombre) + '</span>' : '<span class="tag">Normal</span>') + '</div><div class="list">' +
    TEM.map(function(t, i){
      var seg = function(k, tx){ return '<button type="button" data-m="' + k + '" aria-pressed="' + (t.modo === k) + '">' + tx + '</button>'; };
      return '<div class="card tema stack" data-i="' + i + '"><div class="row"><span class="dot" style="background:' + (TEMA_COLOR[t.id] || '#E6007E') + '"></span><b style="flex:1;font-size:17px">' + esc(t.nombre) + '</b>' + (hoy && hoy.id === t.id ? '<span class="tag ok">Activo ahora</span>' : '') + '</div>' +
        '<div class="seg" role="group" aria-label="Modo de ' + esc(t.nombre) + '">' + seg('off', 'Apagado') + seg('auto', 'Según la fecha') + seg('on', 'Activado') + '</div>' +
        '<div class="fechas"><div><label class="l">Desde (día/mes)</label><input type="text" data-k="desde" value="' + esc(t.desde) + '" inputmode="numeric" placeholder="01/12" maxlength="5"></div><div><label class="l">Hasta (día/mes)</label><input type="text" data-k="hasta" value="' + esc(t.hasta) + '" inputmode="numeric" placeholder="26/12" maxlength="5"></div></div>' +
        '<div><label class="l">Cartel de la portada</label><input type="text" data-k="cartel" value="' + esc(t.cartel || '') + '" maxlength="120" placeholder="Ej: Navidad: regalá una pieza única."></div></div>';
    }).join('') + '</div><button class="btn primary" id="t-save" type="button" style="margin-top:14px;width:100%">Guardar temas</button>';
  $(VIEW).innerHTML = h;
  [].forEach.call(document.querySelectorAll('.tema [data-m]'), function(b){ b.onclick = function(){
    readTem(); var i = +b.closest('.tema').dataset.i, m = b.dataset.m;
    if(m === 'on') TEM.forEach(function(t){ if(t.modo === 'on') t.modo = 'auto'; });
    TEM[i].modo = m; viewTem();
  }; });
  $('#t-save').onclick = async function(){
    readTem();
    try { S = await run('Guardando…', function(){ return call('api_saveThemes', TEM); }); TEM = null; render(); toast('Temas guardados: la tienda los toma al recargar'); } catch(e){}
  };
}

/* ================= MÁS (mensajes y datos del negocio) ================= */
function viewGui(){
  var G = [['Guia-Panel-Sowy.pdf', 'Guía del panel de servicio', 'Prendas, pedidos, fotos, temas y mensajes, paso a paso'], ['Guia-Tienda-Sowy.pdf', 'Guía de la tienda', 'Cómo compra una clienta, de punta a punta']];
  $(VIEW).innerHTML = '<h2>Guías de uso</h2><div class="hint" style="margin-bottom:12px">Instructivos en PDF para leer o descargar en el celu.</div><div class="stack">' +
    G.map(function(g){ return '<a class="card" style="display:flex;gap:12px;align-items:center;text-decoration:none;color:inherit" href="guias/' + g[0] + '" target="_blank" rel="noopener" download><div style="flex:1"><b>' + g[1] + '</b><div class="hint">' + g[2] + ' · PDF</div></div><span class="btn sm primary" style="pointer-events:none">Abrir</span></a>'; }).join('') + '</div>';
}
function viewMas(){
  $('#view').innerHTML = '<div class="seg" id="mas-seg" role="group" aria-label="Sección" style="margin-bottom:14px"><button type="button" data-s="msg" aria-pressed="' + (MAS === 'msg') + '">Mensajes</button><button type="button" data-s="biz" aria-pressed="' + (MAS === 'biz') + '">Negocio</button><button type="button" data-s="gui" aria-pressed="' + (MAS === 'gui') + '">Guías</button></div><div id="mas-body"></div>';
  [].forEach.call(document.querySelectorAll('#mas-seg [data-s]'), function(b){ b.onclick = function(){ MAS = b.dataset.s; viewMas(); }; });
  VIEW = '#mas-body';
  try { (MAS === 'msg' ? viewMsg : MAS === 'gui' ? viewGui : viewBiz)(); } finally { VIEW = '#view'; }
}

/* ---------- Modo claro / oscuro (se recuerda en este navegador; sin elección guardada sigue al sistema) ---------- */
(function(){
  var root = document.documentElement, btn = document.getElementById('theme-btn'), KEY = 'sowy-theme', mq = matchMedia('(prefers-color-scheme: dark)');
  function stored(){ try { var s = localStorage.getItem(KEY); return s === 'dark' || s === 'light' ? s : null; } catch(e){ return null; } }
  function set(t){
    root.dataset.theme = t;
    var bg = getComputedStyle(root).getPropertyValue('--bg').trim() || (t === 'dark' ? '#0A0A0B' : '#FFFFFF');
    document.querySelectorAll('meta[name=theme-color]').forEach(function(m, i){ if(i) m.remove(); else { m.removeAttribute('media'); m.setAttribute('content', bg); } });
    if(btn){ var l = t === 'dark' ? 'Cambiar a modo claro' : 'Cambiar a modo oscuro'; btn.setAttribute('aria-label', l); btn.title = l; }
  }
  set(root.dataset.theme || 'light');
  if(btn) btn.addEventListener('click', function(){ var n = root.dataset.theme === 'dark' ? 'light' : 'dark'; try { localStorage.setItem(KEY, n); } catch(e){} set(n); });
  if(mq.addEventListener) mq.addEventListener('change', function(){ if(!stored()) set(mq.matches ? 'dark' : 'light'); });
})();

/* ================= ARRANQUE ================= */
async function start(){
  if(!LOCAL && !APPS_URL){ $('#view').innerHTML = '<div class="empty"><b>Panel todavía sin conectar</b><br>Falta enlazarlo con la hoja de cálculo del negocio.</div>'; return; }
  render();
  try { S = await call('api_bootstrap'); render(); }
  catch(e){ if(!/sesi|ingres|cuenta/i.test(e.message)) $('#view').innerHTML = '<div class="empty">No pude cargar el panel.<br>' + esc(e.message) + '<br><br><button class="btn" onclick="start()">Reintentar</button></div>'; }
}
if(tokenOk(TOKEN)) start(); else { render(); }
if('serviceWorker' in navigator && location.protocol === 'https:'){ addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); }); }
